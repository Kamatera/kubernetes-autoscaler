on:
  push:
    branches:
      - kamatera-cluster-autoscaler-*
    paths:
      - .github/workflows/ca-kamatera.yaml
      - third_party/kamatera/**
      - cluster-autoscaler/**

permissions:
  packages: write
  contents: read

jobs:
  cluster-autoscaler-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        POWER_OFF_ON_SCALE_DOWN: [yes, no]
        POWER_ON_ON_SCALE_UP: [yes, no]
        POWER_ON_ON_SCALE_UP_CONFIG_JSON:
          - |
            {
              "set_power_configs_on_nodegroup": true,
              "power_off_max_servers": 2
            }
          - |
            {
              "set_power_configs_on_nodegroup": true,
              "power_off_max_servers": 1
            }
      fail-fast: false  # ensure cleanup is done
    steps:
      - uses: actions/checkout@v6
        with:
          path: kubernetes-autoscaler
      - uses: actions/checkout@v6
        with:
          repository: Kamatera/kamatera-rke2-kubernetes-terraform-example
          path: kamatera-rke2-kubernetes-terraform-example
      - uses: hashicorp/setup-terraform@v3
      - run: |
          wget https://cloudcli.cloudwm.com/binaries/latest/cloudcli-linux-amd64.tar.gz
          tar -xvf cloudcli-linux-amd64.tar.gz
          chmod +x cloudcli
          sudo mv cloudcli /usr/local/bin/cloudcli
      - run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KAMATERA_SSHKEY_PUB }}" > ~/.ssh/id_rsa.pub
          echo "${{ secrets.KAMATERA_SSHKEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: kubernetes-autoscaler/third_party/kamatera
      - env:
          KAMATERA_API_CLIENT_ID: ${{ secrets.KAMATERA_API_CLIENT_ID }}
          KAMATERA_API_SECRET: ${{ secrets.KAMATERA_API_SECRET }}
          POWER_OFF_ON_SCALE_DOWN: ${{ matrix.POWER_OFF_ON_SCALE_DOWN }}
          POWER_ON_ON_SCALE_UP: ${{ matrix.POWER_ON_ON_SCALE_UP }}
          TF_VAR_cluster_autoscaler_slack_webhook_url: ${{ secrets.CLUSTER_AUTOSCALER_SLACK_WEBHOOK_URL }}
        run: |
          cd kubernetes-autoscaler/cluster-autoscaler
          export K8S_VERSION="${GITHUB_REF_NAME#*kamatera-cluster-autoscaler-release-}"
          if [ "${K8S_VERSION}" == "${GITHUB_REF_NAME}" ] ; then
            export K8S_VERSION=$(grep -oP 'ClusterAutoscalerVersion\s*=\s*"\K[0-9]+\.[0-9]+' version/version.go)
          fi
          echo K8S_VERSION=${K8S_VERSION}
          # check if commit message contains "--skip-kamatera-tests" to skip tests
          if git log -1 --pretty=%B | grep -q -- "--skip-kamatera-tests"; then
            echo "Skipping Kamatera cluster-autoscaler tests"
            exit 0
          fi
          make build
          cd ../third_party/kamatera
          uv sync
          uv run python -u -m pytest -vvx --capture=tee-sys tests

  cluster-autoscaler-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: cluster-autoscaler
          push: true
          tags: |
            ghcr.io/kamatera/kubernetes-autoscaler:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/heads/kamatera-cluster-autoscaler') && format('ghcr.io/kamatera/kubernetes-autoscaler:{0}', github.ref_name) || '' }}
          cache-from: type=registry,ref=ghcr.io/kamatera/kubernetes-autoscaler:{{ github.ref_name }}
          cache-to: type=inline
